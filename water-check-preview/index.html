<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>私、水分足りてる？｜からだMAP preview</title><style>
:root{--p:#5D4B33;--l:#8D734B;--a:#E49F17;--bg:#F6F5EA;--s:#FAF9F2;--m:#8A877E;--line:#ECE9DD;--red:#9B3636;--green:#728967}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--p);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}.app{max-width:520px;margin:auto;padding:18px 14px 48px}.logo{text-align:center}.logo img{width:176px}.card{background:#fff;border-radius:28px;padding:25px 21px;box-shadow:0 14px 32px #0000000e}.top{display:flex;justify-content:space-between;align-items:center}.badge{font-size:.72rem;font-weight:700;background:#eee8d9;padding:5px 10px;border-radius:99px}.bar{height:7px;background:#efede5;border-radius:99px;margin:15px 0 23px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a);transition:.2s}.hide{display:none!important}h1,.rt{text-align:center;line-height:1.5}.rt{font-size:1.4rem;font-weight:800;margin:5px 0 20px}.lead,.help,.note,.block p,.block li{line-height:1.75}.lead{font-size:.95rem}.help{font-size:.84rem;color:var(--m);margin-top:0}.note{font-size:.82rem;background:var(--s);padding:13px 14px;border-radius:14px}.qt{font-weight:800;font-size:1.1rem;line-height:1.6}.opts{display:grid;gap:9px}.opt{background:var(--s);border:2px solid transparent;border-radius:13px;padding:13px;line-height:1.55;cursor:pointer}.opt input{margin-right:8px;accent-color:var(--a)}.opt:has(input:checked){border-color:var(--a);background:#fff8e9;color:#966810;font-weight:700}.gate{padding:13px 0;border-top:1px solid var(--line)}.gate:first-of-type{border-top:0}.yn{display:flex;gap:8px;margin-top:8px}.yn label{flex:1;text-align:center;background:var(--s);padding:9px;border:2px solid transparent;border-radius:11px}.yn input{display:none}.yn label:has(input:checked){border-color:var(--a);background:#fff8e9;font-weight:700}.act{display:flex;gap:9px;margin-top:21px}.btn{border:0;border-radius:14px;padding:14px 15px;font-weight:800;cursor:pointer}.primary{background:var(--a);color:#fff;flex:1;box-shadow:0 5px 0 #c98b14}.secondary{background:#f0eee6;color:var(--l)}.err{font-size:.82rem;color:var(--red);min-height:1.2em;margin-top:10px}.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.sw div{padding:7px;border:1px solid var(--line);border-radius:11px;text-align:center;font-size:.66rem;color:var(--m)}.sw b{display:block;height:32px;border-radius:7px;margin-bottom:6px}.block{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.block h2{font-size:.93rem;color:var(--l)}.block p,.block li{font-size:.89rem}.obs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.obs div{background:var(--s);padding:11px;border-radius:12px;text-align:center;font-size:.84rem}.obs small{display:block;color:var(--m);margin-bottom:4px}.alert{background:#fff8f0;border-left:4px solid #a4572a;padding:12px;border-radius:10px;font-size:.84rem;line-height:1.65;margin-top:15px}.urgent{background:#fff1f1;border-color:var(--red)}.cta{background:#f2f6ef;padding:15px;border-radius:14px;margin-top:20px}.cta p{font-size:.84rem;line-height:1.7}.cta a{display:block;background:var(--green);color:#fff;text-align:center;text-decoration:none;font-weight:800;padding:12px;border-radius:11px}details{font-size:.73rem;color:#87837a;margin-top:16px}details a{color:var(--l)}.foot{text-align:center;font-size:.7rem;color:#969289;line-height:1.7}@media(max-width:380px){.obs{grid-template-columns:1fr}.card{padding:22px 17px}}
</style></head><body><div class="app"><div class="logo"><img src="../logo.png" alt="からだMAP"></div><main class="card"><div class="top"><span class="badge">公開前 preview v0.1</span><button id="resetTop" class="btn secondary hide">最初から</button></div><div class="bar"><i id="bar"></i></div><div id="v"></div></main><p class="foot">公開前確認用。回答はサーバーへ送信・保存しません。</p></div><script src="./app.js"></script></body></html>
